name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      contents: read

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      contents: read

  release:
    if: github.event_name == 'release'
    needs: [build, zizmor]
    uses: nullean/.github/.github/workflows/release.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      contents: write
      id-token: write
    # with:
    #   assets-rids: '["linux-x64", "linux-arm64", "osx-arm64", "win-x64", "win-arm64"]'
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
