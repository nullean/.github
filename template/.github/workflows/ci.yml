name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macOS runners are scarce: pull requests test on Linux and Windows, main adds macOS. A release runs no tests of its
  # own; its main-green gate requires main's full run, macOS included, to have passed on the released commit.
  build:
    if: github.event_name != 'release'
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      contents: read
    with:
      os: >-
        ${{ github.event_name == 'push'
          && '["ubuntu-latest", "windows-latest", "macos-latest"]'
          || '["ubuntu-latest", "windows-latest"]' }}

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      contents: read

  # packs at the release's tag (and builds per-RID assets if asked) in the shared workflow...
  # Fails first unless main's ci.yml passed on the released commit (the shared workflow's main-green job). Native
  # osx-arm64 assets are the one macOS job a release still runs: macOS AOT only compiles on macOS.
  release:
    if: github.event_name == 'release'
    needs: zizmor
    uses: nullean/.github/.github/workflows/release.yml@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
    permissions:
      actions: read # the main-green gate reads main's runs
      contents: write
    # with:
    #   assets-rids: '["linux-x64", "linux-arm64", "osx-arm64", "win-x64", "win-arm64"]'

  # ...and publishes from this file: nuget.org's trusted publishing checks that the token's workflow is this ci.yml,
  # which a job inside the shared workflow would not be.
  publish:
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@__NULLEAN_GITHUB_SHA__ # __NULLEAN_GITHUB_REF__
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages
