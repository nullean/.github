version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
  # the workflows every repository is given; their nullean/.github pins are placeholders and are left alone
  - package-ecosystem: github-actions
    directory: /template/.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
