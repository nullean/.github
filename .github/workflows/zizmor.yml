# Reusable: static analysis of the calling repo's GitHub Actions workflows.
name: zizmor

on:
  workflow_call:
    inputs:
      min-severity:
        description: Lowest severity that fails the check.
        type: string
        default: medium

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # findings fail the job and show as annotations; no SARIF upload, so it works on PRs from forks too
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: ${{ inputs.min-severity }}
